name: Sync to Scaffold

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify-scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.EHSRE_APP_ID }}
          private-key: ${{ secrets.EHSRE_PRIVATE_KEY }}
          owner: noisefactorllc

      - name: Trigger scaffold sync
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/noisefactorllc/scaffold/dispatches \
            -d '{"event_type":"plugin-updated","client_payload":{"plugin":"sre-discipline"}}'
